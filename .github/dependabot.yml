version: 2
updates:
  # Docker base images - one entry per Dockerfile directory
  - package-ecosystem: "docker"
    directory: "/c++"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/go"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/java"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/nodejs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/python"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/python-django"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/python-flask"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/ruby"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/rust"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/typescript"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
      include: "scope"

  # Rust dependencies (cargo)
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "cargo"
      include: "scope"

  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/python-django"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "pip"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/python-flask"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "pip"
      include: "scope"

  # Node.js / TypeScript dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/nodejs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "npm"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/typescript"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "npm"
      include: "scope"

  # GitHub Actions (for future workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
