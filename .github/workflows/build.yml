name: Build Dockerfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.sample }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample:
          - c++
          - go
          - nodejs
          - python
          - python-django
          - python-flask
          - ruby
          - rust
          - typescript
          # java is excluded — requires a pre-built JAR in the build context
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          TAG=$(echo "${{ matrix.sample }}" | tr '+' 'p')
          docker build -t "test-${TAG}" ./${{ matrix.sample }}
